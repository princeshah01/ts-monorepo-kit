name: turbo-starter

services:
  postgres:
    image: postgres:16-alpine
    container_name: turbo-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: turbo-redis
    restart: unless-stopped
    env_file:
      - ./.env
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"'
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  redis-commander:
    image: rediscommander/redis-commander
    container_name: turbo-redis-ui
    env_file:
      - ./.env
    ports:
      - "${REDISCOMMANDER_PORT}:8081"
    environment:
      REDIS_HOSTS: local:${REDIS_HOST}:${REDIS_PORT}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
